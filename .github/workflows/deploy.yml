name: Deploy callback

on:
  push:
    branches: [master]

jobs:
  deploy_callback:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify deploy webhook
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST http://127.0.0.1:9876/deploy \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${DEPLOY_WEBHOOK_SECRET}" \
            -d "{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"branch\":\"${GITHUB_REF_NAME}\"}"
